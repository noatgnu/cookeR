name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build (CGO disabled -- cooker must be a static binary with no runtime library dependency)
        run: go build ./...
        env:
          CGO_ENABLED: 0

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -v
        env:
          CGO_ENABLED: 0
